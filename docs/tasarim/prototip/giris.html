<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4F3">
  <title>Giriş yap · BeautyOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="bilesenler.css">
  <style>
    .gk { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    .gk__ust { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; }
    .gk__kutu { width: 100%; max-width: 440px; margin: 32px 0 auto; }
    .gk__kutu--genis { max-width: 560px; }
    .gk__kutu h1 { font-size: var(--yazi-24); line-height: var(--satir-24); font-weight: 600; letter-spacing: -0.01em; }
    @media (min-width: 640px) { .gk__kutu h1 { font-size: var(--yazi-32); line-height: var(--satir-32); } .gk__kutu { margin-top: 64px; } }
    .gk__alt { margin-top: 32px; font-size: var(--yazi-12); color: var(--renk-metin-soluk); display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .gk__alt a { color: inherit; display: inline-flex; align-items: center; min-height: 44px; }
    /* 44 px yalnız tek başına duran bağlantılara; cümle içi bağlantılar satır içi kalır (WCAG 2.5.8 istisnası) */
    .gk__kutu div > a:not(.dugme):not(.satir), .gk__kutu p[style*="text-align:center"] > a, .gk__ust a:not(.marka) { display: inline-flex; align-items: center; min-height: 44px; }
    .gk form { margin-top: 24px; }
    .kod { font-size: 28px; letter-spacing: .4em; text-align: center; font-variant-numeric: tabular-nums; }
    .kurtarma { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 15px; }
  </style>
</head>
<body>
  <div class="gk"><div class="gk__ust" id="ust"></div><main class="gk__kutu" id="ana" tabindex="-1"></main><footer class="gk__alt"><a href="tanitim.html#yasal/sartlar">Kullanım şartları</a><a href="tanitim.html#yasal/gizlilik">Gizlilik politikası</a><a href="tanitim.html#yasal/kvkk">Aydınlatma metni</a></footer></div>
  <script src="veri.js"></script>
  <script src="prototip.js"></script>
  <script>
  (function () {
    const ik = P.ikon, V = VERI;
    const alan = (id, et, tip = 'text', ek = '', ipucu = '') => `<div class="alan"><label class="alan__etiket" for="${id}">${et}</label><input class="alan__girdi" id="${id}" type="${tip}" ${ek}>${ipucu ? `<p class="alan__ipucu" id="${id}-ip">${ipucu}</p>` : ''}</div>`;
    const sifre = (id, et, ac = 'current-password', ipucu = '') => `<div class="alan"><label class="alan__etiket" for="${id}">${et}</label><div class="alan__kutu" style="position:relative"><input class="alan__girdi" id="${id}" type="password" autocomplete="${ac}" style="padding-left:12px;padding-right:48px" ${ipucu ? `aria-describedby="${id}-ip"` : ''}><button type="button" class="dugme dugme--ikon alan__sag" data-goster="${id}" aria-label="Şifreyi göster" aria-pressed="false">${ik('goz')}</button></div>${ipucu ? `<p class="alan__ipucu" id="${id}-ip">${ipucu}</p>` : ''}</div>`;
    const TURLER = [['kuafor', 'Kuaför'], ['berber', 'Berber'], ['guzellik', 'Güzellik merkezi'], ['estetik', 'Estetik kliniği'], ['dis', 'Diş hekimi'], ['diger', 'Diğer randevulu işletme']];
    const kurulumAdim = (P.klinik ? ['tur', 'klinik', 'hbys', 'guvenlik', 'saatler', 'hizmetler', 'ekip', 'yasal', 'hazir'] : ['tur', 'saatler', 'hizmetler', 'ekip', 'yasal', 'hazir']);
    const ilerleme = (a) => { const i = kurulumAdim.indexOf(a); return `<div class="adimlar" aria-hidden="true" style="margin-bottom:8px">${kurulumAdim.slice(0, -1).map((_, j) => `<span data-durum="${j < i ? 'bitti' : j === i ? 'simdi' : ''}"></span>`).join('')}</div><p class="metin-kucuk metin-soluk">Kurulum · ${Math.min(i + 1, kurulumAdim.length - 1)}/${kurulumAdim.length - 1}</p>`; };
    const sonraki = (a) => kurulumAdim[kurulumAdim.indexOf(a) + 1];
    const kAlt = (a, atlanir = true, eylem = 'Devam et') => `<div class="dugme-sirasi" style="margin-top:24px;justify-content:space-between">${atlanir ? `<a class="dugme dugme--metin" href="#kurulum/${sonraki(a)}">Şimdilik atla</a>` : '<span></span>'}<a class="dugme dugme--birincil" href="#kurulum/${sonraki(a)}">${eylem}</a></div>`;
    const E = {
      giris: () => ['Giriş yap', `<h1>Giriş yap</h1><p class="metin-ikincil" style="margin-top:6px">Randevu, ${P.T('kisi').toLocaleLowerCase('tr-TR')} ve kasa işleriniz tek yerde.</p>
        ${P.param('hata') === '1' ? `<div class="serit serit--hata" role="alert" style="margin-top:20px">${ik('hata')}<span class="serit__metin">E-posta veya şifre hatalı.</span></div>` : ''}
        ${P.param('hata') === 'sinir' ? `<div class="serit serit--uyari" role="alert" style="margin-top:20px">${ik('saat')}<span class="serit__metin">Çok fazla yanlış giriş denemesi. 15 dakika sonra tekrar deneyin. Şifrenizi unuttuysanız “Şifremi unuttum”u kullanın.</span></div>` : ''}
        <form novalidate data-testid="giris-formu">${alan('g-ep', 'E-posta', 'email', 'autocomplete="email" spellcheck="false"')}${sifre('g-sf', 'Şifre')}<div style="text-align:right;margin-top:8px"><a href="#sifremi-unuttum" class="metin-14">Şifremi unuttum</a></div><button class="dugme dugme--birincil dugme--tam" style="margin-top:20px" data-git="${P.klinik ? '#2fa' : 'panel.html' + location.search}">Giriş yap</button></form>
        <p class="metin-14 metin-ikincil" style="margin-top:24px;text-align:center">Hesabınız yok mu? <a href="#kayit">Ücretsiz deneyin</a></p>`],
      '2fa': () => ['Doğrulama kodu', `<h1>Doğrulama kodu</h1><p class="metin-ikincil" style="margin-top:6px">Doğrulama uygulamanızdaki 6 haneli kodu girin.</p><form novalidate>${alan('f-kod', 'Kod', 'text', 'class="alan__girdi kod" inputmode="numeric" autocomplete="one-time-code" maxlength="6"')}<label class="secenek"><input type="checkbox"><span class="secenek__metin"><span>Bu cihazı 30 gün hatırla</span></span></label><button class="dugme dugme--birincil dugme--tam" style="margin-top:12px" data-git="panel.html${location.search}">Doğrula</button></form><p class="metin-14" style="margin-top:20px;text-align:center"><a href="#kurtarma-gir">Kurtarma kodu kullan</a></p>`],
      'kurtarma-gir': () => ['Kurtarma kodu', `<h1>Kurtarma kodu</h1><p class="metin-ikincil" style="margin-top:6px">Telefonunuza erişemiyorsanız kurulumda kaydettiğiniz kodlardan birini girin. Her kod bir kez kullanılır.</p><form novalidate>${alan('kr', 'Kurtarma kodu', 'text', 'autocomplete="off" spellcheck="false" placeholder="xxxx-xxxx"')}<button class="dugme dugme--birincil dugme--tam" style="margin-top:20px" data-git="panel.html${location.search}">Giriş yap</button></form>`],
      kayit: () => ['Hesap oluştur', `<p class="metin-kucuk metin-soluk">Adım 1/2</p><h1>İşletmenizi tanıtın</h1><p class="metin-ikincil" style="margin-top:6px">30 gün ücretsiz. Kart bilgisi istenmez.</p><form novalidate>${alan('k-ad', 'İşletme adı', 'text', 'autocomplete="organization" placeholder="Ör. Defne Güzellik Salonu…"')}
        <div class="alan"><label class="alan__etiket" for="k-tur">İşletme türü</label><select id="k-tur" onchange="document.getElementById('k-alt').hidden=this.value!=='diger'">${TURLER.map(([k, a]) => `<option value="${k}" ${k === 'kuafor' ? 'selected' : ''}>${a}</option>`).join('')}</select><p class="alan__ipucu">Ekranlardaki terimler buna göre ayarlanır; sonra değiştirebilirsiniz.</p></div>
        <div class="alan" id="k-alt" hidden><label class="alan__etiket" for="k-alt-s">Hangi alanda çalışıyorsunuz?</label><select id="k-alt-s"><option>Tırnak stüdyosu</option><option>Spa ve güzellik merkezi</option><option>Masaj salonu</option><option>Dövme ve piercing</option><option>Saç ekim merkezi</option><option>Başka</option></select></div>
        <div class="alan"><label class="alan__etiket" for="k-adr">Online randevu adresi</label><div class="alan__on-ek"><span>beautyossapp.com/book/</span><input class="alan__girdi" id="k-adr" value="defne-guzellik" autocomplete="off" spellcheck="false" aria-describedby="k-adr-ip"></div><p class="alan__ipucu" id="k-adr-ip" style="color:var(--renk-basari)">${ik('tamam', 'ikon--16')} Bu adres kullanılabilir.</p></div>
        <a class="dugme dugme--birincil dugme--tam" style="margin-top:20px" href="#kayit-2">Devam et</a></form><p class="metin-14 metin-ikincil" style="margin-top:24px;text-align:center">Hesabınız var mı? <a href="#giris">Giriş yapın</a></p>`],
      'kayit-2': () => ['Hesap oluştur', `<p class="metin-kucuk metin-soluk">Adım 2/2</p><h1>Hesap bilgileriniz</h1><form novalidate id="kf">${alan('k-is', 'Ad soyad', 'text', 'autocomplete="name"')}<div class="alan"><label class="alan__etiket" for="k-tel">Telefon <span class="istege-bagli">(isteğe bağlı)</span></label><div class="alan__on-ek"><span>+90</span><input class="alan__girdi" id="k-tel" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="5xx xxx xx xx"></div></div>${alan('k-ep', 'E-posta', 'email', 'autocomplete="email" spellcheck="false"')}${sifre('k-sf', 'Şifre', 'new-password', 'En az 8 karakter; harf ve rakam içermeli.')}
        <div style="margin-top:16px"><label class="secenek" id="k1-al"><input type="checkbox" id="k1"><span class="secenek__metin"><span><a href="#" data-belge="Kullanım şartları">Kullanım şartlarını</a> ve <a href="#" data-belge="Veri işleme sözleşmesi">Veri işleme sözleşmesini</a> okudum, kabul ediyorum.</span></span></label>
        <label class="secenek"><input type="checkbox"><span class="secenek__metin"><span>BeautyOS’un yeni özellik ve kampanya duyurularını e-postayla almak istiyorum. <span class="metin-soluk">(İsteğe bağlı)</span></span></span></label>
        <p class="metin-14 metin-ikincil" style="margin-top:4px">Kişisel verilerinizin nasıl işlendiğini <a href="#" data-belge="Aydınlatma metni">Aydınlatma metninde</a> bulabilirsiniz.</p></div>
        <button class="dugme dugme--birincil dugme--tam" style="margin-top:20px" id="olustur">Hesap oluştur</button></form>`],
      'sifremi-unuttum': () => ['Şifremi unuttum', `<h1>Şifrenizi mi unuttunuz?</h1><p class="metin-ikincil" style="margin-top:6px">E-posta adresinizi yazın; şifre sıfırlama bağlantısı gönderelim.</p><form novalidate>${alan('su-ep', 'E-posta', 'email', 'autocomplete="email" spellcheck="false"')}<button class="dugme dugme--birincil dugme--tam" style="margin-top:20px" data-git="#gonderildi">Şifre sıfırlama bağlantısı gönder</button></form><p class="metin-14" style="margin-top:20px;text-align:center"><a href="#giris">Giriş ekranına dön</a></p>`],
      gonderildi: () => ['Bağlantı gönderildi', `<span class="bos__ikon">${ik('mesaj')}</span><h1 style="margin-top:12px">E-postanızı kontrol edin</h1><p class="metin-ikincil" style="margin-top:6px">Bu e-posta adresiyle bir hesap varsa, şifre sıfırlama bağlantısını gönderdik. Bağlantı 1 saat geçerlidir.</p><p class="metin-14 metin-ikincil" style="margin-top:16px">E-posta gelmediyse istenmeyen klasörüne bakın ya da <a href="mailto:[DESTEK_E-POSTASI]">[DESTEK_E-POSTASI]</a> adresine yazın.</p><a class="dugme dugme--ikincil dugme--tam" style="margin-top:20px" href="#giris">Giriş ekranına dön</a>`],
      'sifre-sifirla': () => ['Yeni şifre', `<h1>Yeni şifre belirleyin</h1><form novalidate>${sifre('ss-1', 'Yeni şifre', 'new-password', 'En az 8 karakter; harf ve rakam içermeli.')}${sifre('ss-2', 'Yeni şifre (tekrar)', 'new-password')}<button class="dugme dugme--birincil dugme--tam" style="margin-top:20px" data-git="#giris" data-mesaj="Şifreniz değiştirildi. Yeniden giriş yapın.">Şifreyi değiştir</button></form><div class="serit serit--uyari" style="margin-top:24px">${ik('saat')}<span class="serit__metin">Örnek durum: Bu bağlantının süresi dolmuş. <a href="#sifremi-unuttum">Yeni bir bağlantı isteyin.</a></span></div>`],
      davet: () => ['Daveti kabul et', `<h1>${V.SALON.ad} sizi davet etti</h1><p class="metin-ikincil" style="margin-top:6px">Zeynep Arslan · ${P.ROLLER.personel}. Giriş için şifrenizi belirleyin.</p><form novalidate>${alan('dv-ep', 'E-posta', 'email', 'value="zeynep@ornek.test" readonly')}${sifre('dv-sf', 'Şifre', 'new-password', 'En az 8 karakter; harf ve rakam içermeli.')}<p class="metin-14 metin-ikincil" style="margin-top:12px"><a href="tanitim.html#yasal/sartlar">Kullanım şartları</a> ve <a href="tanitim.html#yasal/gizlilik">gizlilik politikası</a> hesabınız için geçerlidir.</p><button class="dugme dugme--birincil dugme--tam" style="margin-top:20px" data-git="${P.klinik ? '#2fa-kur' : 'panel.html?rol=uzman'}">Hesabımı oluştur</button>${P.klinik ? '<p class="alan__ipucu" style="margin-top:8px">Sonraki adım: iki adımlı doğrulama (klinik hesaplarında zorunlu).</p>' : ''}</form>`],
      kilit: () => ['Oturum kilitlendi', `<span class="bos__ikon">${ik('kilit')}</span><h1 style="margin-top:12px">Oturum kilitlendi</h1><p class="metin-ikincil" style="margin-top:6px">10 dakika işlem yapılmadığı için ekran kilitlendi. Kaldığınız yerden devam etmek için şifrenizi girin.</p><form novalidate><div class="satir" style="padding:12px 0;background:none;cursor:default">${P.avatar(V.PERSONEL[1])}<span class="satir__ana"><span class="satir__ust">${V.PERSONEL[1].ad}</span></span></div>${sifre('kl-sf', 'Şifre')}<button class="dugme dugme--birincil dugme--tam" style="margin-top:20px" data-git="panel.html${location.search}">Kilidi aç</button></form><p class="metin-14" style="margin-top:20px;text-align:center"><a href="#giris">Başka hesapla giriş yap</a></p>`],
      '2fa-kur': () => ['İki adımlı doğrulama', `<h1>İki adımlı doğrulamayı kurun</h1><p class="metin-ikincil" style="margin-top:6px">${P.klinik ? 'Klinik hesaplarında zorunludur.' : 'Hesabınızı şifreye ek bir kodla korur.'}</p><ol class="yigin" style="padding-left:20px;margin-top:20px"><li>Telefonunuza bir doğrulama uygulaması kurun (ör. Google Authenticator, Microsoft Authenticator).</li><li>Uygulamada bu kodu tarayın:<div style="width:168px;height:168px;margin:12px 0;border:1px solid var(--renk-cizgi);border-radius:var(--yaricap-kart);display:grid;place-items:center" class="metin-soluk metin-kucuk" role="img" aria-label="Kare kod (örnek yer tutucu)">Kare kod</div><span class="metin-14 metin-soluk">Tarayamıyorsanız anahtarı yazın: <span translate="no" style="font-family:ui-monospace,Consolas,monospace">JBSW Y3DP EHPK 3PXP</span></span></li><li>Uygulamadaki 6 haneli kodu girin.</li></ol>${alan('2k', 'Kod', 'text', 'class="alan__girdi kod" inputmode="numeric" autocomplete="one-time-code" maxlength="6"')}<a class="dugme dugme--birincil dugme--tam" style="margin-top:20px" href="#kurtarma">Doğrula</a>`],
      kurtarma: () => ['Kurtarma kodları', `<h1>Kurtarma kodlarınızı saklayın</h1><p class="metin-ikincil" style="margin-top:6px">Telefonunuzu kaybederseniz bu kodlarla giriş yaparsınız. Her kod bir kez kullanılır. Bu ekranı kapattıktan sonra kodlar yeniden gösterilmez.</p><div class="kart kurtarma" style="padding:16px;margin-top:20px" translate="no">${['4KQ7-2MXA', 'P9VD-L3TE', 'Z8HN-61QB', 'R2CY-WK5F', 'M7TJ-0DLS', 'B5XG-HQ9N', 'E3UF-7VPA', 'N6KR-C2ZW'].map((c) => `<span>${c}</span>`).join('')}</div><div class="dugme-sirasi" style="margin-top:12px"><button class="dugme dugme--ikincil" onclick="P.bildir('Kodlar kopyalandı.')">${ik('kopya')}Kopyala</button><button class="dugme dugme--ikincil" onclick="window.print()">${ik('yazdir')}Yazdır</button></div><label class="secenek" style="margin-top:12px"><input type="checkbox"><span class="secenek__metin"><span>Kodları güvenli bir yere kaydettim.</span></span></label><a class="dugme dugme--birincil dugme--tam" style="margin-top:12px" href="${location.hash.includes('kurtarma') && sessionStorage.getItem('bos-kurulum') ? '#kurulum/saatler' : 'panel.html' + location.search + '#bugun'}">Bitir</a>`],
      kurulum: (a = 'tur') => {
        const b = {
          tur: ['İşletme türü', `<h1>Ne tür bir işletmesiniz?</h1><p class="metin-ikincil" style="margin-top:6px">Terimleri ve önerilen hizmetleri buna göre hazırlarız.</p><div class="yigin yigin--8" data-tekli role="radiogroup" aria-label="İşletme türü" style="margin-top:20px">${TURLER.map(([k, t]) => `<button class="secim-kart" aria-pressed="${k === P.tur || (k === 'kuafor' && !P.klinik && P.tur === 'kuafor')}" data-deger="${k}"><span class="secim-kart__ana"><span class="orta">${t}</span></span></button>`).join('')}</div>${kAlt(a, false)}`],
          klinik: ['Sağlık kuruluşu bilgileri', `<h1>Sağlık kuruluşu bilgileri</h1><p class="metin-ikincil" style="margin-top:6px">Online randevu sayfanızın alt bilgisinde görünür.</p><form novalidate>${alan('kb-ad', 'Kuruluş adı', 'text', `value="${V.SALON.ad}"`)}${alan('kb-r', 'Ruhsat no', 'text', 'autocomplete="off"')}${alan('kb-h', 'Sorumlu hekim', 'text', 'autocomplete="off"')}</form>${kAlt(a, true)}`],
          hbys: ['Bilgilendirme', `<span class="bos__ikon">${ik('bilgi')}</span><h1 style="margin-top:12px">BeautyOS ne yapar, ne yapmaz</h1><p style="margin-top:8px;font-size:17px">BeautyOS bir muayene ya da tedavi kayıt programı değildir; e-Nabız bildirimleri ve yasal tıbbi kayıt yükümlülükleriniz için kullandığınız sistemin yerine geçmez. Randevu, kasa ve işletme işlerini düzenler.</p><p class="metin-ikincil" style="margin-top:8px">Tıbbi kayıtları yasal süre boyunca saklama yükümlülüğü kliniğinize aittir.</p><label class="secenek" style="margin-top:16px"><input type="checkbox"><span class="secenek__metin"><span>Okudum, anladım.</span></span></label>${kAlt(a, false)}`],
          guvenlik: ['Güvenlik', `<h1>Hesabınızı koruyun</h1><p class="metin-ikincil" style="margin-top:6px">Klinik hesaplarında iki adımlı doğrulama zorunludur. Kurulum yaklaşık 2 dakika sürer.</p><a class="dugme dugme--birincil dugme--tam" style="margin-top:20px" href="#2fa-kur" onclick="sessionStorage.setItem('bos-kurulum','1')">İki adımlı doğrulamayı kur</a><p class="alan__ipucu" style="margin-top:12px">Bu adım atlanamaz. Kurulmadan sağlık bilgilerine erişilemez.</p>`],
          saatler: ['Çalışma saatleri', `<h1>Ne zaman açıksınız?</h1><p class="metin-ikincil" style="margin-top:6px">Online randevuda yalnız bu saatler açılır.</p><div class="kart" style="padding:4px 16px;margin-top:20px">${V.SALON.calismaSaatleri.map(([g, x, y]) => `<div class="satir-arasi" style="padding:10px 0;border-top:1px solid var(--renk-cizgi-hafif)"><label class="secenek" style="padding:0;min-width:120px"><input type="checkbox" ${x ? 'checked' : ''}><span class="secenek__metin"><span>${g}</span></span></label>${x ? `<span class="metin-14 sayi">${x} – ${y}</span>` : '<span class="metin-14 metin-soluk">Kapalı</span>'}</div>`).join('')}</div>${kAlt(a)}`],
          hizmetler: ['Hizmetler', `<h1>${P.klinik ? 'İşlemlerinizi seçin' : 'Hizmetlerinizi seçin'}</h1><p class="metin-ikincil" style="margin-top:6px">Önerilerden seçin; süre ve fiyatı sonra değiştirebilirsiniz.</p><div class="cipler" data-tekli style="margin:16px 0;flex-wrap:wrap">${V.HIZMETLER.slice(0, 9).map((h, i) => `<button class="cip" aria-pressed="${i < 4}">${h.ad}</button>`).join('')}</div><button class="dugme dugme--metin dugme--kucuk" style="padding:0">${ik('arti', 'ikon--16')}Kendiniz ekleyin</button>${kAlt(a)}`],
          ekip: ['Ekip', `<h1>Ekibinizi ekleyin</h1><p class="metin-ikincil" style="margin-top:6px">Davet bağlantısı gönderilir; herkes kendi şifresini belirler.</p><div class="alan-satir" style="margin-top:20px"><div class="alan"><label class="alan__etiket" for="ek-ep">E-posta</label><input class="alan__girdi" id="ek-ep" type="email" spellcheck="false" autocomplete="off"></div><div class="alan"><label class="alan__etiket" for="ek-y">Yetki seti</label><select id="ek-y"><option>${P.ROLLER.personel}</option><option>Resepsiyon</option><option>Müdür</option>${P.klinik ? '<option>Sağlık personeli</option>' : ''}</select></div></div><button class="dugme dugme--ikincil" style="margin-top:12px">Davet gönder</button><label class="secenek" style="margin-top:12px"><input type="checkbox"><span class="secenek__metin"><span>Şimdilik yalnız ben çalışıyorum</span></span></label>${kAlt(a)}`],
          yasal: ['Yasal bilgiler', `<h1>Veri sorumlusu bilgileri</h1><p class="metin-ikincil" style="margin-top:6px">Bu bilgiler aydınlatma metninde “veri sorumlusu” olarak yer alır.</p><form novalidate>${alan('ys-u', 'Ticari unvan ya da ad soyad')}${alan('ys-a', 'Adres')}${alan('ys-e', 'İletişim e-postası', 'email', 'spellcheck="false"')}</form><fieldset style="border:0;padding:0;margin:16px 0 0"><legend class="alan__etiket">Aydınlatma metni</legend><label class="secenek"><input type="radio" name="ay" checked><span class="secenek__metin"><span>BeautyOS şablonunu kullan (önerilen)</span></span></label><label class="secenek"><input type="radio" name="ay"><span class="secenek__metin"><span>Kendi metnimi yapıştır</span></span></label></fieldset>${kAlt(a, true, 'Kaydet ve devam et')}`],
          hazir: ['Hazır', `<span class="bos__ikon" style="background:var(--renk-basari-zemin);color:var(--renk-basari)">${ik('tamam')}</span><h1 style="margin-top:12px">Kurulum tamam.</h1><p class="metin-ikincil" style="margin-top:6px">Şimdi ilk işlerinizi yapın:</p><ul class="liste kart" style="margin-top:16px"><li><a class="satir" href="panel.html?ac=randevu-yeni${P.klinik ? '&tur=' + P.tur : ''}#bugun">${ik('takvim')}<span class="satir__ana"><span class="satir__ust">İlk randevuyu oluşturun</span></span>${ik('ileri', 'satir__ok')}</a></li><li><button class="satir" data-kopyala="https://beautyossapp.com/book/${V.SALON.salonAdresi}">${ik('baglanti')}<span class="satir__ana"><span class="satir__ust">Online randevu bağlantısını kopyalayın</span><span class="satir__alt">beautyossapp.com/book/${V.SALON.salonAdresi}</span></span>${ik('kopya', 'satir__ok')}</button></li><li><a class="satir" href="panel.html${location.search}#ayarlar/saatler">${ik('saat')}<span class="satir__ana"><span class="satir__ust">Çalışma saatlerini gözden geçirin</span></span>${ik('ileri', 'satir__ok')}</a></li></ul><a class="dugme dugme--birincil dugme--tam" style="margin-top:20px" href="panel.html${location.search}#bugun">Bugün’e git</a>`],
        }[a] || ['', ''];
        return [b[0], (a !== 'hazir' && a !== 'hbys' ? ilerleme(a) : '') + b[1], true];
      },
    };
    function ciz() {
      const [ad, alt] = (location.hash.slice(1) || 'giris').split('/');
      const [baslik, html, genis] = (E[ad] || E.giris)(alt);
      document.title = `${baslik} · BeautyOS`;
      document.getElementById('ust').innerHTML = `${P.marka('tanitim.html')}${['giris', 'kayit', 'kayit-2'].includes(ad) ? `<a class="metin-14" href="tanitim.html">Ana sayfa</a>` : ''}`;
      const k = document.getElementById('ana'); k.className = 'gk__kutu' + (genis ? ' gk__kutu--genis' : ''); k.innerHTML = html;
      k.querySelectorAll('[data-goster]').forEach((b) => (b.onclick = () => { const i = document.getElementById(b.dataset.goster); const g = i.type === 'password'; i.type = g ? 'text' : 'password'; b.setAttribute('aria-pressed', String(g)); b.setAttribute('aria-label', g ? 'Şifreyi gizle' : 'Şifreyi göster'); b.innerHTML = ik(g ? 'gozKapali' : 'goz'); }));
      k.querySelectorAll('[data-git]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); P.isle(b, b.textContent.includes('Giriş') ? 'Giriş yapılıyor…' : 'Gönderiliyor…', () => { if (b.dataset.mesaj) P.bildir(b.dataset.mesaj); location.href = b.dataset.git; }, 600); }));
      k.querySelectorAll('[data-belge]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); e.stopPropagation(); P.katmanAc({ baslik: a.dataset.belge, govde: `<p class="metin-14 metin-soluk">Sürüm v0 · Yürürlük: [GG.AA.YYYY]</p><div class="cerceve-bos" style="margin-top:12px">[YASAL METİN — avukat onayından sonra eklenecek · Belge: ${a.dataset.belge}]</div>`, alt: '<button class="dugme dugme--ikincil" data-katman-kapat>Kapat</button>' }); }));
      const ol = k.querySelector('#olustur');
      if (ol) ol.onclick = (e) => { e.preventDefault(); const k1 = k.querySelector('#k1'); k.querySelector('#k1-hata')?.remove(); if (!k1.checked) { k.querySelector('#k1-al').insertAdjacentHTML('afterend', `<p class="alan__hata" id="k1-hata" role="alert">${ik('hata', 'ikon--16')}Devam etmek için Kullanım Şartları’nı ve Veri İşleme Sözleşmesi’ni kabul etmeniz gerekir.</p>`); k1.focus(); return; } P.isle(ol, 'Hesap oluşturuluyor…', () => { P.bildir('Hesabınız hazır.'); location.hash = '#kurulum/tur'; }, 800); };
      const h1 = k.querySelector('h1'); if (h1) { h1.tabIndex = -1; h1.style.outline = 'none'; h1.focus({ preventScroll: true }); }
    }
    window.addEventListener('hashchange', () => { ciz(); window.scrollTo(0, 0); });
    ciz(); P.cubuk({ rol: false });
  })();
  </script>
