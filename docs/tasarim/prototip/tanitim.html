  <style>
    body { background: var(--color-surface); font-size: 17px; line-height: 1.55; }
    .kap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 1024px) { .kap { padding: 0 40px; } }
    .ust { position: sticky; top: 0; z-index: 20; background: var(--color-surface); }
    .ust .kap { display: flex; align-items: center; gap: 24px; height: 68px; }
    .ust nav { display: flex; gap: 4px; margin-left: auto; align-items: center; }
    .ust nav a { color: var(--color-text); text-decoration: none; font-size: 15px; font-weight: 500; padding: 10px 12px; border-radius: var(--radius-control); }
    .ust nav a:hover { background: var(--color-surface-active); }
    .ust nav .dugme { margin-left: 8px; color: var(--color-on-primary); }
    @media (max-width: 899px) { .ust nav .gizle-m { display: none; } }
    h1.vitrin { font-size: clamp(2.25rem, 1.3rem + 3.6vw, 4.5rem); line-height: 1.04; letter-spacing: -0.035em; font-weight: 500; max-width: 22ch; }
    .tk-dar { display: none; } @media (max-width: 639px) { .tk-genis { display: none; } .tk-dar { display: block; } }
    h2.bolum { font-size: clamp(2rem, 1.4rem + 2.2vw, 3.25rem); line-height: 1.06; letter-spacing: -0.03em; font-weight: 500; max-width: 16ch; }
    .giris-metni { font-size: clamp(18px, 1rem + .4vw, 21px); line-height: 1.5; color: var(--color-text-secondary); max-width: 46ch; }
    .hero { padding: 40px 0 0; }
    .hero__izgara { display: grid; gap: 40px; }
    @media (min-width: 1024px) { .hero { padding: 72px 0 0; } .hero__izgara { grid-template-columns: 5fr 7fr; align-items: end; } }
    .sahne { background: var(--ref-petrol-700); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 28px 20px 0; position: relative; }
    @media (min-width: 1024px) { .sahne { padding: 40px 48px 0; } }
    .parca { background: var(--color-surface); border-radius: 12px 12px 0 0; box-shadow: 0 -1px 0 rgba(255,255,255,.04); overflow: hidden; font-size: 14px; line-height: 20px; }
    .etiket-ornek { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: #DCE8EA; margin-bottom: 12px; }
    .sahne__alt { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .sahne__alt .dugme { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.24); }
    section.blok { padding: 72px 0; }
    @media (min-width: 1024px) { section.blok { padding: 120px 0; } }
    @media (max-width: 479px) { .hero .dugme-sirasi { flex-direction: column; align-items: stretch; } .hero .dugme-sirasi a:last-child { align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; } }
    .alt a { display: inline-flex; align-items: center; min-height: 32px; }
    .satir5-7 { display: grid; gap: 32px; align-items: center; }
    @media (min-width: 1024px) { .satir5-7 { grid-template-columns: 5fr 7fr; gap: 64px; } .satir5-7--ters > :first-child { order: 2; } }
    .satir5-7 + .satir5-7 { margin-top: 80px; }
    .alan-pudra { background: var(--ref-powder-100); }
    .alan-petrol { background: var(--ref-petrol-700); color: #fff; }
    .alan-petrol .giris-metni { color: #DCE8EA; }
    .alan-gri { background: var(--color-page); }
    .is-listesi { display: grid; gap: 0; margin-top: 40px; }
    @media (min-width: 900px) { .is-listesi { grid-template-columns: 1fr 1fr; column-gap: 64px; } }
    .is { padding: 20px 0; border-top: 1px solid var(--color-border); display: grid; gap: 4px; }
    .is h3 { font-size: 20px; line-height: 28px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
    .is p { color: var(--color-text-secondary); }
    ol.adimlar-vitrin { list-style: none; counter-reset: a; padding: 0; margin: 40px 0 0; display: grid; gap: 32px; }
    @media (min-width: 900px) { ol.adimlar-vitrin { grid-template-columns: repeat(4, 1fr); } }
    ol.adimlar-vitrin li { counter-increment: a; display: grid; gap: 6px; }
    ol.adimlar-vitrin li::before { content: counter(a); font-size: 48px; line-height: 1; font-weight: 500; color: var(--ref-powder-500); letter-spacing: -0.03em; }
    ol.adimlar-vitrin h3 { font-size: 20px; font-weight: 600; }
    details.sss { border-top: 1px solid var(--color-border); }
    details.sss summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; padding: 20px 0; font-size: 19px; font-weight: 500; }
    details.sss summary::-webkit-details-marker { display: none; }
    details.sss summary::after { content: "+"; font-size: 24px; line-height: 1; color: var(--color-text-muted); }
    details.sss[open] summary::after { content: "−"; }
    details.sss p { padding: 0 0 20px; color: var(--color-text-secondary); max-width: 68ch; }
    .alt { background: var(--ref-petrol-900); color: #DCE8EA; padding: 64px 0 calc(32px + env(safe-area-inset-bottom)); font-size: 15px; }
    .alt a { color: #fff; }
    .alt__ad { font-size: clamp(56px, 10vw, 140px); line-height: .9; letter-spacing: -0.05em; font-weight: 500; color: #fff; margin-bottom: 40px; }
    .alt__izgara { display: grid; gap: 24px; }
    @media (min-width: 900px) { .alt__izgara { grid-template-columns: 2fr 1fr 1fr; } }
    .alt ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .yapiskan { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--color-surface); border-top: 1px solid var(--color-border); z-index: 25; transform: translateY(110%); transition: transform var(--duration-base) var(--ease-out); }
    .yapiskan[data-gorunur="true"] { transform: none; }
    @media (min-width: 900px) { .yapiskan { display: none; } }
    .fiyat-kutu { border: 1px dashed var(--color-border-control); border-radius: var(--radius-card); padding: 32px; max-width: 560px; }
    .uzun { max-width: 70ch; }
    .uzun h2 { font-size: 24px; margin: 32px 0 8px; font-weight: 600; }
    .uzun p, .uzun li { color: var(--color-text-secondary); }
    [data-ui] .satir { min-height: 52px; }
    .ust nav a[aria-current="page"] { background: var(--color-surface-active); }

  <header class="ust" id="ust" data-kaydi="false" data-menu="false"><div class="kap"><span id="marka"></span><nav aria-label="Ana gezinme"><a class="gizle-m" href="#ozellikler">Özellikler</a><a class="gizle-m" href="#fiyat">Fiyat</a><a class="gizle-m" href="#sss">Sorular</a><a class="gizle-m" href="#iletisim">İletişim</a><a class="gizle-xs gizle-m-giris" href="giris.html#giris">Giriş</a><a class="dugme ust__cta" href="giris.html#kayit">Ücretsiz deneyin</a><button class="ust__menu" id="ust-dugme" type="button" aria-expanded="false" aria-controls="ust-panel"><span class="gizli-metin">Menü</span><i aria-hidden="true"></i></button></nav></div>
    <div class="ust__panel" id="ust-panel" hidden><a href="#ozellikler">Özellikler</a><a href="#fiyat">Fiyat</a><a href="#sss">Sorular</a><a href="#iletisim">İletişim</a><a href="giris.html#giris">Giriş</a></div></header>
  <main id="ana" tabindex="-1"></main>

  <script>
  (function () {
    const V = VERI, ik = P.ikon, para = P.para;
    document.getElementById('marka').outerHTML = P.marka('#');
    const yakinda = '<span class="durum durum--yakinda">Yakında</span>';
    const onizleme = yakinda;
    const maske = (t) => `0500 *** ** ${t.slice(-2)}`;
    const per = (id) => V.PERSONEL.find((p) => p.id === id);
    // Vitrin verisi: yalnız canlıda olan işlevler; online randevu, sağlık, gün sonu düğmesi, rol setleri yok; tarih yok ("Örnek gün")
    const R = V.RANDEVULAR.filter((r) => r.kanal !== 'online' && r.durum !== 'iptal').sort((a, b) => P.dk(a.bas) - P.dk(b.bas));
    const kart = (r) => `<div class="randevu-kart kisi-${per(r.p).ton}" style="cursor:default"><span class="randevu-kart__serit"></span><span class="randevu-kart__ana"><span class="randevu-kart__saat">${r.bas} – ${r.bit}</span><span class="orta">${r.musteri}</span><span class="metin-14 metin-soluk">${r.hizmet} · ${per(r.p).kisa}</span></span><span class="randevu-kart__sag">${P.durumEtiketi(r.durum)}</span></div>`;
    const sirada = () => {
      const s = R.filter((r) => ['suruyor', 'onayli'].includes(r.durum)).slice(0, 3);
      return `<div data-ui class="parca" role="img" aria-label="BeautyOS Bugün ekranı: şimdi ve sırada olan randevular ve personelin günü (örnek, kurgusal veri)">
        <div style="padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:baseline"><span class="baslik-sayfa" style="font-size:20px">Bugün</span><span class="metin-kucuk metin-soluk">Örnek gün</span></div>
        <ul class="liste" data-anim="satirlar">${s.map((r) => `<li><div class="satir" style="cursor:default">${P.avatar(per(r.p))}<span class="satir__ana"><span class="satir__ust"><span class="sayi">${r.bas}</span> · ${r.musteri}</span><span class="satir__alt">${r.hizmet} · ${per(r.p).kisa}</span></span>${P.durumEtiketi(r.durum)}</div></li>`).join('')}</ul>
        <div style="padding:16px;border-top:1px solid var(--color-border-subtle)"><p class="metin-14" style="margin-bottom:10px"><strong>Şu an boş:</strong> ${simdiBos()}.</p>${seritHtml()}</div></div>`;
    };
    // Panelle aynı hesap: şu an (14:20) randevusu olmayan personel ve bir sonraki randevusuna kadar
    function simdiBos() {
      const s = 860;
      return V.PERSONEL.filter((p) => !p.hizmetVermez).map((p) => {
        const rr = V.RANDEVULAR.filter((r) => r.p === p.id && !['iptal', 'gelmedi'].includes(r.durum));
        if (rr.some((r) => P.dk(r.bas) <= s && P.dk(r.bit) > s)) return null;
        const n = rr.filter((r) => P.dk(r.bas) > s).sort((a, b) => P.dk(a.bas) - P.dk(b.bas))[0];
        return `${p.kisa} (${n ? n.bas : '20:00'}’e kadar)`;
      }).filter(Boolean).join(', ');
    }
    function seritHtml() {
      const y = (d) => ((d - 540) / 660) * 100;
      return `<div class="doluluk">${V.PERSONEL.filter((p) => !p.hizmetVermez).map((p) => `<div class="doluluk__satir kisi-${p.ton}"><span class="doluluk__ad">${P.avatar(p, 'avatar--kucuk')}<span>${p.kisa}</span></span><div class="doluluk__iz">${R.filter((r) => r.p === p.id).map((r) => `<span class="doluluk__blok ${r.durum === 'suruyor' ? 'doluluk__blok--suruyor' : ''} ${['bitti', 'gelmedi'].includes(r.durum) ? 'doluluk__blok--bitti' : ''}" style="left:${y(P.dk(r.bas))}%;width:${(r.sure / 660) * 100}%"></span>`).join('')}<span class="doluluk__simdi" style="left:${y(860)}%"></span></div></div>`).join('')}<div class="doluluk__eksen"><span></span><div><span>09</span><span>12</span><span>15</span><span>18</span><span>20</span></div></div></div>`;
    }
    const kasaParca = () => `<div data-ui class="parca" style="border-radius:12px" role="img" aria-label="Kasa özeti: tahsilat, nakit, kart ve gider (örnek, kurgusal veri)"><div style="padding:16px"><p class="baslik-bolum" style="margin-bottom:12px">Kasa · Örnek gün</p><div class="ozet ozet--yigilir" style="--sutun:4"><div class="ozet__oge"><span class="ozet__etiket">Tahsilat</span><span class="ozet__deger" data-roll>${para(V.KASA.ciro)}</span></div><div class="ozet__oge"><span class="ozet__etiket">Nakit</span><span class="ozet__deger" data-roll>${para(V.KASA.nakit)}</span></div><div class="ozet__oge"><span class="ozet__etiket">Kart</span><span class="ozet__deger" data-roll>${para(V.KASA.kart)}</span></div><div class="ozet__oge"><span class="ozet__etiket">Gider</span><span class="ozet__deger" data-roll>${para(V.KASA.gider)}</span></div></div>
      <ul class="liste" style="margin-top:12px" data-anim="satirlar">${R.filter((r) => r.durum === 'bitti').slice(0, 4).map((r) => `<li><div class="satir" style="cursor:default;padding-left:0;padding-right:0"><span class="satir__ana"><span class="satir__ust">${r.musteri}</span><span class="satir__alt">${r.hizmet}</span></span><span class="satir__sag"><span class="sayi orta">${para(r.tutar)}</span><span class="metin-kucuk metin-soluk">${r.odeme}</span></span></div></li>`).join('')}</ul></div></div>`;
    const musteriParca = () => `<div data-ui class="parca" style="border-radius:12px" role="img" aria-label="Müşteri kartı: geçmiş randevular ve not (örnek, kurgusal veri)"><div style="padding:16px"><p class="baslik-sayfa" style="font-size:20px">Hande Polat</p><p class="metin-14 metin-soluk">${maske('27')} · 9 ziyaret</p><div class="ozet" style="--sutun:2;margin-top:12px"><div class="ozet__oge"><span class="ozet__etiket">Toplam harcama</span><span class="ozet__deger">${para(8650)}</span></div><div class="ozet__oge"><span class="ozet__etiket">Son ziyaret</span><span class="ozet__deger" style="font-size:16px">12.09.2026</span></div></div><p class="metin-14" style="margin-top:12px"><span class="orta">Not:</span> Kahve sevmez, su ikram edin.</p><ul class="liste" style="margin-top:8px" data-anim="satirlar">${V.HANDE_GECMIS.filter((g) => g.durum === 'bitti').map((g) => `<li><div class="satir" style="cursor:default;padding-left:0;padding-right:0"><span class="satir__ana"><span class="satir__ust">${g.hizmet}</span><span class="satir__alt">${g.tarih} · ${per(g.p).kisa}</span></span><span class="sayi">${para(g.tutar)}</span></div></li>`).join('')}</ul></div></div>`;
    const takvimParca = () => `<div class="tk-genis">${takvimGenis()}</div><div class="tk-dar"><div data-ui class="parca" style="border-radius:12px" role="img" aria-label="Telefonda takvim: saat sırasıyla randevular (örnek, kurgusal veri)"><div style="padding:16px" class="yigin yigin--8" data-anim="satirlar">${R.slice(0, 4).map(kart).join('')}</div></div></div>`;
    const takvimGenis = () => { const pp = V.PERSONEL.filter((p) => !p.hizmetVermez).slice(0, 3); const SY = 44; return `<div data-ui class="parca" data-anim="dusme" style="border-radius:12px;overflow:auto" role="img" aria-label="Takvim: personel sütunlarında günün randevuları (örnek, kurgusal veri)"><div class="takvim" style="--sutun:3;--saat-y:${SY}px;border:0;max-height:none;min-width:520px"><div class="takvim__kose"></div>${pp.map((p) => `<div class="takvim__kisi">${P.avatar(p, 'avatar--kucuk')}${p.kisa}</div>`).join('')}<div class="takvim__eksen">${[9, 10, 11, 12, 13, 14, 15, 16, 17].map((s) => `<div>${String(s).padStart(2, '0')}:00</div>`).join('')}</div>${pp.map((p) => `<div class="takvim__sutun kisi-${p.ton}" style="height:${9 * SY}px">${R.filter((r) => r.p === p.id && P.dk(r.bas) < 1080).map((r) => `<span class="takvim__olay takvim__olay--${r.durum}" style="top:${((P.dk(r.bas) - 540) / 60) * SY + 1}px;height:${(r.sure / 60) * SY - 3}px"><strong>${r.sure > 30 ? r.musteri : r.bas + ' ' + r.musteri}</strong>${r.sure > 45 ? `<span>${r.hizmet}</span>` : ''}</span>`).join('')}<div class="takvim__simdi" style="top:${((860 - 540) / 60) * SY}px"></div></div>`).join('')}</div></div>`; };
    const cta = (ters) => `<div class="dugme-sirasi" style="margin-top:32px;gap:16px"><a class="dugme dugme--birincil" style="min-height:52px;padding:0 24px;font-size:17px;${ters ? 'background:#fff;color:var(--ref-petrol-900)' : ''}" href="giris.html#kayit">Ücretsiz deneyin</a><a href="#iletisim/demo" style="${ters ? 'color:#fff' : ''};font-weight:500">Demo isteyin</a></div>`;

    // ---- Hikâye ekranları (yapışkan telefon): bir randevunun günü. Kurgusal veri. ----
    const ekranUst = (b, a = '') => `<div class="ek-ust"><span class="ek-baslik">${b}</span>${a}</div>`;
    const EKRANLAR = [
      ['Randevu oluştur', 'Telefon çalar: “Bugün saat dörtte yeriniz var mı?” Müşteriyi bulun, hizmeti ve boş saati seçin.', `${ekranUst('Randevu oluştur')}<div class="ek-govde"><p class="ek-etiket">Müşteri</p><div class="secim-kart" aria-checked="true" style="cursor:default"><span class="avatar avatar--kucuk">HP</span><span class="secim-kart__ana"><span class="orta">Hande Polat</span><span class="metin-kucuk metin-soluk">${maske('27')}</span></span></div>
        <p class="ek-etiket">Hizmet</p><div class="secim-kart" aria-checked="true" style="cursor:default"><span class="secim-kart__ana"><span class="orta">Kadın saç kesimi</span><span class="metin-kucuk metin-soluk">45 dk</span></span><span class="sayi orta">${para(850)}</span></div>
        <p class="ek-etiket">Saat · Elif</p><div class="saatler ek-saatler">${['15:15', '16:00', '16:15', '17:00', '17:15', '18:30'].map((t) => `<span class="saat" ${t === '16:15' ? 'aria-pressed="true" data-ek-sec' : ''} style="display:grid;place-items:center">${t}</span>`).join('')}</div></div><div class="ek-alt"><span class="dugme dugme--birincil dugme--tam">Randevu oluştur</span></div>`],
      ['Hatırlatma', 'Randevudan önce müşteriye kısa bir hatırlatma gider.', `${ekranUst('Mesajlar', yakinda)}<div class="ek-govde ek-mesaj"><p class="metin-kucuk metin-soluk" style="text-align:center">Bugün 12:15</p><div class="ek-balon">Defne Güzellik Salonu: Bugün 16:15’te randevunuz var. Değişiklik için 0500 000 00 10.</div><p class="metin-kucuk metin-soluk" style="margin-top:12px">Hatırlatma SMS’i yakında.</p></div>`, 1],
      ['Tamamla ve ödeme al', 'İş bitince tek ekranda: tutar hazır, nakit ya da kart, istenirse bahşiş. Prim kendiliğinden hesaplanır.', `${ekranUst('Tamamla ve ödeme al')}<div class="ek-govde"><p class="metin-14 metin-soluk">Hande Polat · Kadın saç kesimi · Elif</p><p class="ek-etiket">Tutar</p><p class="ek-tutar sayi">${para(850)}</p><p class="ek-etiket">Ödeme yöntemi</p><div class="parcali parcali--tam"><button tabindex="-1" aria-pressed="false">Nakit</button><button tabindex="-1" aria-pressed="true" data-ek-sec>Kart</button></div><div class="ek-tamam" data-ek-tamam>${ik('tamamDaire')}<span>Ödeme alındı.</span></div></div><div class="ek-alt"><span class="dugme dugme--birincil dugme--tam">Ödeme al · ${para(850)}</span></div>`],
      ['Kasa', 'Akşam kasa hazır: tahsilat, nakit, kart ve gider tek ekranda.', `${ekranUst('Kasa')}<div class="ek-govde"><div class="ozet ozet--yigilir" style="--sutun:2"><div class="ozet__oge"><span class="ozet__etiket">Tahsilat</span><span class="ozet__deger" data-roll>${para(V.KASA.ciro)}</span></div><div class="ozet__oge"><span class="ozet__etiket">Gider</span><span class="ozet__deger" data-roll>${para(V.KASA.gider)}</span></div><div class="ozet__oge"><span class="ozet__etiket">Nakit</span><span class="ozet__deger" data-roll>${para(V.KASA.nakit)}</span></div><div class="ozet__oge"><span class="ozet__etiket">Kart</span><span class="ozet__deger" data-roll>${para(V.KASA.kart)}</span></div></div><ul class="liste" style="margin-top:12px">${R.filter((r) => r.durum === 'bitti').slice(0, 3).map((r) => `<li><div class="satir" style="cursor:default;padding:8px 0;min-height:0"><span class="satir__ana"><span class="satir__ust">${r.musteri}</span><span class="satir__alt">${r.hizmet}</span></span><span class="sayi">${para(r.tutar)}</span></div></li>`).join('')}</ul></div>`],
    ];
