<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sistem yönetimi · BeautyOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="bilesenler.css">
  <style>
    .yk-etiket { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); background: var(--color-surface-active); padding: 2px 8px; border-radius: var(--radius-tag); margin-left: 4px; }
    .destek-serit { position: sticky; top: 0; z-index: 30; background: var(--color-danger); color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 500; display: flex; gap: 8px; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="kok"></div>
  <script src="veri.js"></script>
  <script src="prototip.js"></script>
  <script>
  (function () {
    const V = VERI, ik = P.ikon, para = P.para;
    const MENU = [['genel', 'Genel bakış', 'rapor'], ['salonlar', 'Salonlar', 'hesap'], ['yasal', 'Yasal belgeler', 'fatura']];
    const ozet = { toplam: V.SALONLAR.length, aktif: V.SALONLAR.filter((s) => s.durum === 'Aktif').length, deneme: V.SALONLAR.filter((s) => s.plan === 'Deneme').length, dolan: 1, yeni: 3 };
    const plan = (p) => `<span class="durum ${p === 'Deneme' ? 'durum--bekliyor' : 'durum--onayli'}">${p}</span>`;
    const durum = (d) => `<span class="durum ${d === 'Aktif' ? 'durum--bitti' : 'durum--iptal'}">${d}</span>`;
    const E = {
      giris: () => `<div style="min-height:100dvh;display:grid;place-items:center;padding:24px"><div style="width:100%;max-width:400px"><div style="display:flex;align-items:center;gap:8px">${P.marka('#')}<span class="yk-etiket">Sistem yönetimi</span></div><h1 class="baslik-sayfa" style="margin-top:32px">BeautyOS ekibi girişi</h1><p class="metin-ikincil" style="margin-top:4px">Yalnız BeautyOS ekibi içindir.</p><form novalidate style="margin-top:24px"><div class="alan"><label class="alan__etiket" for="y-e">E-posta</label><input class="alan__girdi" id="y-e" type="email" autocomplete="username" spellcheck="false"></div><div class="alan"><label class="alan__etiket" for="y-s">Şifre</label><input class="alan__girdi" id="y-s" type="password" autocomplete="current-password"></div><div class="alan"><label class="alan__etiket" for="y-k">Doğrulama kodu</label><input class="alan__girdi" id="y-k" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div><a class="dugme dugme--birincil dugme--tam" style="margin-top:20px" href="#genel">Giriş yap</a></form><p class="metin-kucuk metin-soluk" style="margin-top:16px">Oturum 15 dakika işlem yapılmazsa kapanır.</p></div></div>`,
      genel: () => `${baslik('Genel bakış', 'BeautyOS’taki salon ve klinikler')}<div class="ozet ozet--yigilir" style="--sutun:5">${[['Toplam', ozet.toplam], ['Aktif', ozet.aktif], ['Deneme süresinde', ozet.deneme], ['Denemesi bu hafta biten', ozet.dolan], ['Son 30 günde kayıt', ozet.yeni]].map(([a, b]) => `<div class="ozet__oge"><span class="ozet__etiket">${a}</span><span class="ozet__deger">${b}</span></div>`).join('')}</div>
        <section class="kart" style="margin-top:24px">${'<div class="kart__baslik"><h2 class="baslik-bolum">İlgilenilmesi gerekenler</h2></div>'}<ul class="liste"><li><a class="satir" href="#salon/2"><span class="satir__ana"><span class="satir__ust">Lale Tırnak Stüdyosu</span><span class="satir__alt">Denemesi 02.11.2026’da bitiyor · Kayıttan beri randevu yok</span></span>${ik('ileri', 'satir__ok')}</a></li><li><a class="satir" href="#salon/3"><span class="satir__ana"><span class="satir__ust">Mavi Saç Tasarım</span><span class="satir__alt">Pasif · Eski sözleşme sürümünde (v0)</span></span>${ik('ileri', 'satir__ok')}</a></li></ul></section>`,
      salonlar: () => `${baslik('Salonlar', `${V.SALONLAR.length} hesap`)}<div class="dugme-sirasi" style="margin-bottom:12px"><div class="alan__kutu" style="flex:1;min-width:220px">${ik('ara')}<input class="alan__girdi" type="search" placeholder="Salon adı ya da adresi…" aria-label="Salon ara"></div><div class="alan" style="min-width:160px"><select aria-label="Plan"><option>Tüm planlar</option><option>Deneme</option><option>Başlangıç</option><option>Pro</option></select></div><div class="alan" style="min-width:160px"><select aria-label="Durum"><option>Tüm durumlar</option><option>Aktif</option><option>Pasif</option></select></div></div>
        ${P.durum === 'bos' ? `<div class="kart">${'<div class="bos bos--orta"><p class="bos__baslik">Sonuç bulunamadı.</p><p class="bos__metin">Başka bir ad deneyin ya da süzgeçleri temizleyin.</p></div>'}</div>` : `<div class="kart tablo-kutu"><table class="tablo"><thead><tr><th>Salon</th><th>Sahip</th><th>Plan</th><th>Durum</th><th>Deneme bitişi</th><th class="sayi">Kullanıcı</th><th class="sayi">Müşteri</th><th>Son giriş</th><th>Sözleşme</th></tr></thead><tbody>${V.SALONLAR.map((s, i) => `<tr><td><a href="#salon/${i}">${s.ad}</a></td><td>${s.sahip}<br><span class="metin-kucuk metin-soluk">${s.eposta}</span></td><td>${plan(s.plan)}</td><td>${durum(s.durum)}</td><td class="sayi">${s.bitis}</td><td class="sayi">${s.kullanici}</td><td class="sayi">${s.musteri}</td><td>${s.sonGiris}</td><td>${s.kabul}</td></tr>`).join('')}</tbody></table></div>`}`,
      salon: (i = 0) => { const s = V.SALONLAR[i] || V.SALONLAR[0]; return `<a href="#salonlar" class="dugme dugme--metin dugme--kucuk" style="padding:0">${ik('geri', 'ikon--16')}Salonlar</a>${baslik(s.ad, `${s.sahip} · ${s.eposta} · Kayıt ${s.kayit}`, `<button class="dugme dugme--ikincil" data-destek>Destek erişimi aç</button>`)}
        <div class="iki-sutun"><div class="yigin"><div class="ozet ozet--yigilir" style="--sutun:3"><div class="ozet__oge"><span class="ozet__etiket">Son 30 gün randevu</span><span class="ozet__deger">${s.randevu30}</span></div><div class="ozet__oge"><span class="ozet__etiket">Müşteri sayısı</span><span class="ozet__deger">${s.musteri}</span></div><div class="ozet__oge"><span class="ozet__etiket">Son 30 gün ciro</span><span class="ozet__deger">${para(s.ciro30)}</span></div></div>
          <section class="kart"><div class="kart__baslik"><h2 class="baslik-bolum">Plan ve durum</h2></div><div class="kart__govde"><div class="alan-satir"><div class="alan"><label class="alan__etiket" for="sp">Plan</label><select id="sp"><option ${s.plan === 'Deneme' ? 'selected' : ''}>Deneme</option><option>Başlangıç</option><option>Pro</option></select></div><div class="alan"><label class="alan__etiket" for="sd">Deneme bitişi</label><input class="alan__girdi" id="sd" type="date" value="2026-11-17"></div></div><div class="alan"><label class="alan__etiket" for="sn">Not <span class="istege-bagli">(ödeme, fatura no vb.)</span></label><textarea id="sn" placeholder="Ör. 12.11.2026 havale alındı, fatura no…"></textarea></div><div class="dugme-sirasi" style="justify-content:space-between;margin-top:16px"><button class="dugme dugme--tehlike" data-pasif>${s.durum === 'Aktif' ? 'Pasif yap' : 'Aktif yap'}</button><button class="dugme dugme--birincil" onclick="P.bildir('Değişiklikler kaydedildi.')">Kaydet</button></div></div></section></div>
          <section class="kart"><div class="kart__baslik"><h2 class="baslik-bolum">Yasal kayıtlar</h2></div><ul class="liste"><li><div class="satir"><span class="satir__ana"><span class="satir__ust">Kullanım şartları ${s.kabul}</span><span class="satir__alt">Kabul: ${s.kayit} · ${s.sahip}</span></span></div></li><li><div class="satir"><span class="satir__ana"><span class="satir__ust">Veri işleme sözleşmesi ${s.kabul}</span><span class="satir__alt">Kabul: ${s.kayit} · ${s.sahip}</span></span></div></li></ul><p class="kart__govde metin-kucuk metin-soluk">Bu panelde salonların müşteri listesi, telefonları, sağlık bilgileri ve fotoğrafları gösterilmez. Ciro yalnız toplam olarak görünür.</p></section></div>`; },
      yasal: () => `${baslik('Yasal belgeler', 'Sürümler ve yeniden kabul')}<div class="kart tablo-kutu"><table class="tablo"><thead><tr><th>Belge</th><th>Yürürlükteki sürüm</th><th>Yürürlük</th><th class="sayi">Eski sürümde kalan</th><th></th></tr></thead><tbody>${['Kullanım şartları', 'Veri işleme sözleşmesi', 'Gizlilik politikası', 'KVKK aydınlatma metni'].map((b, i) => `<tr><td class="orta">${b}</td><td>v1</td><td class="sayi">18.10.2026</td><td class="sayi">${i < 2 ? 1 : '—'}</td><td><button class="dugme dugme--metin dugme--kucuk" data-surum>Yeni sürüm yayınla</button></td></tr>`).join('')}</tbody></table></div>`,
    };
    function baslik(h, a, e = '') { return `<div class="sayfa-ust"><div class="sayfa-ust__metin"><h1 class="baslik-sayfa">${h}</h1><p class="metin-ikincil metin-14">${a}</p></div>${e ? `<div class="sayfa-ust__eylem">${e}</div>` : ''}</div>`; }
    let destek = false;
    function ciz() {
      const [ad, arg] = (location.hash.slice(1) || 'giris').split('/');
      const kok = document.getElementById('kok');
      if (ad === 'giris') { kok.innerHTML = E.giris(); return; }
      kok.innerHTML = `${destek ? `<div class="destek-serit" role="status">${ik('kilit', 'ikon--16')}Destek erişimi · Bu oturum kayıt altına alınıyor · <button class="dugme dugme--metin dugme--kucuk" style="color:#fff;min-height:28px" data-kapat-destek>Erişimi kapat</button></div>` : ''}<div class="kabuk"><nav class="yan-menu" aria-label="Yönetim menüsü"><div style="display:flex;align-items:center;gap:4px">${P.marka('#genel')}</div><span class="yk-etiket" style="align-self:flex-start;margin:0 8px 16px">Sistem yönetimi</span>${MENU.map(([k, a, i]) => `<a href="#${k}" ${k === ad || (ad === 'salon' && k === 'salonlar') ? 'aria-current="page"' : ''}>${ik(i)}<span>${a}</span></a>`).join('')}<div class="yan-menu__alt"><a href="#giris">${ik('cikis')}<span>Çıkış yap</span></a></div></nav>
        <div><header class="ust-bar">${P.isaret(26)}<span class="ust-bar__baslik" style="margin-left:8px">Sistem yönetimi</span>${MENU.map(([k, a]) => `<a class="dugme dugme--metin dugme--kucuk" href="#${k}">${a}</a>`).join('')}</header><main class="ana" style="padding-bottom:48px">${P.durum === 'hata' ? `<div class="kart hata-blok" role="alert">${ik('hata')}<div><p class="kalin">Liste yüklenemedi.</p><p class="metin-ikincil metin-14">Bağlantınızı kontrol edip tekrar deneyin.</p></div></div>` : (E[ad] || E.genel)(arg)}</main></div></div>`;
      kok.querySelectorAll('table.tablo').forEach((t) => { const h = [...t.querySelectorAll('thead th')].map((x) => x.textContent.trim()); t.querySelectorAll('tbody tr').forEach((tr) => [...tr.children].forEach((c, i) => (c.dataset.etiket = h[i] || ''))); });
      kok.querySelector('[data-destek]')?.addEventListener('click', () => { const k = P.katmanAc({ baslik: 'Destek erişimi aç', govde: `<p class="metin-ikincil">Salon hesabını destek amacıyla görüntülersiniz. Sağlık bilgisi sekmeleri bu modda kapalıdır. Salon sahibi erişim geçmişini görür.</p><div class="alan" style="margin-top:12px"><label class="alan__etiket" for="dn">Destek nedeni</label><textarea id="dn" placeholder="Ör. sahip, randevu eklenemiyor dedi (talep no …)"></textarea></div>`, alt: `<button class="dugme dugme--ikincil" data-katman-kapat>Vazgeç</button><button class="dugme dugme--birincil" data-a>Erişimi aç</button>` }); k.kok.querySelector('[data-a]').onclick = () => { if (!k.kok.querySelector('#dn').value.trim()) { P.bildir('Destek nedenini yazın.', { tur: 'hata' }); return; } k.kapat(); destek = true; ciz(); }; });
      kok.querySelector('[data-kapat-destek]')?.addEventListener('click', () => { destek = false; ciz(); });
      kok.querySelector('[data-pasif]')?.addEventListener('click', () => P.onay({ baslik: 'Salon pasif yapılsın mı?', metin: 'Salon kullanıcıları giriş yaptığında “Planınız aktif değil” ekranını görür. Veriler silinmez; 30 gün sonra silinir.', eylem: 'Pasif yap', ek: `<ul class="metin-14" style="padding-left:20px;margin-top:12px;display:grid;gap:4px"><li>Salon sahibine e-postayla bildirim gider (veri talep yolu ve 30 günlük süreyle).</li><li>Veri talebi: <strong>Yok</strong> (talep varsa önce karşılanmalı).</li><li>Klinik hesaplarında sahibe tıbbi kayıt saklama yükümlülüğü ayrıca hatırlatılır.</li></ul>`, sonra: () => P.bildir('Salon pasif yapıldı.') }));
      kok.querySelectorAll('[data-surum]').forEach((b) => b.addEventListener('click', () => P.katmanAc({ baslik: 'Yeni sürüm yayınla', govde: `<div class="alan-satir"><div class="alan"><label class="alan__etiket" for="ys">Sürüm</label><input class="alan__girdi" id="ys" value="v2"></div><div class="alan"><label class="alan__etiket" for="yt">Yürürlük tarihi</label><input class="alan__girdi" id="yt" type="date"></div></div><div class="alan"><label class="alan__etiket" for="yo">Değişiklik özeti</label><textarea id="yo" placeholder="2–4 madde"></textarea></div><div class="alan"><span class="alan__etiket">Belge dosyası</span><button type="button" class="dugme dugme--ikincil">${ik('fatura')}Dosya seç</button></div><label class="secenek"><input type="checkbox"><span class="secenek__metin"><span>Metin avukat onayından geçti.</span></span></label><fieldset style="border:0;padding:0;margin:12px 0 0"><legend class="alan__etiket">Salonlara nasıl duyurulsun?</legend><label class="secenek"><input type="radio" name="dy" ${b.closest('tr').textContent.match(/Kullanım|Veri işleme/) ? 'checked' : 'disabled'}><span class="secenek__metin"><span>Yeniden kabul iste</span><span class="metin-kucuk metin-soluk">Yalnız kullanım şartları ve veri işleme sözleşmesi için.</span></span></label><label class="secenek"><input type="radio" name="dy" ${b.closest('tr').textContent.match(/Kullanım|Veri işleme/) ? '' : 'checked'}><span class="secenek__metin"><span>Bildir</span><span class="metin-kucuk metin-soluk">Aydınlatma metni ve gizlilik politikası için.</span></span></label></fieldset>`, alt: `<button class="dugme dugme--ikincil" data-katman-kapat>Vazgeç</button><button class="dugme dugme--birincil" data-katman-kapat onclick="P.bildir('Sürüm yayınlandı.')">Yayınla</button>` })));
    }
    window.addEventListener('hashchange', ciz);
    ciz(); P.cubuk({ rol: false });
  })();
  </script>
</body>
</html>
