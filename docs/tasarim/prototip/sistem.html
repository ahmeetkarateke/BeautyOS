<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı · BeautyOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="bilesenler.css">
  <style>
    .sy { min-height: 100dvh; display: flex; flex-direction: column; padding: 24px 20px; }
    .sy__kutu { margin: auto 0; max-width: 520px; padding: 48px 0; }
    @media (min-width: 768px) { .sy { padding: 32px 48px; } .sy__kutu { margin: auto; width: 100%; } }
    .sy__kod { font-size: 15px; color: var(--color-accent-text); font-weight: 500; }
    .sy h1 { font-size: clamp(2rem, 1.5rem + 2vw, 2.75rem); line-height: 1.1; letter-spacing: -0.025em; font-weight: 500; margin-top: 8px; }
    .sy p.acik { font-size: 17px; color: var(--color-text-secondary); margin-top: 12px; max-width: 44ch; }
  </style>
</head>
<body>
  <div class="sy"><div id="ust"></div><main class="sy__kutu" id="ana"></main></div>
  <div class="serit serit--uyari" id="cevrimdisi" role="status" style="position:fixed;left:12px;right:12px;bottom:12px;max-width:520px;margin:0 auto" hidden><span class="serit__metin"><strong>İnternet bağlantınız yok.</strong><span>Bağlantınız gelince sayfayı yenileyin.</span></span></div>
  <script src="prototip.js"></script>
  <script>
    const E = {
      '404': ['Sayfa bulunamadı', 'Sayfa', 'Sayfa bulunamadı.', 'Adres yanlış yazılmış ya da sayfa kaldırılmış olabilir.', '<a class="dugme dugme--birincil" href="tanitim.html">Ana sayfaya dön</a><a class="dugme dugme--ikincil" href="panel.html#bugun">Bugün’e dön</a>'],
      hata: ['Bir sorun oluştu', 'Beklenmeyen sorun', 'Beklenmeyen bir sorun oluştu.', 'Sayfayı yenileyin. Sürerse destek ekibine yazın: [DESTEK_E-POSTASI]. Referans: 7F3K-2Q9M', '<button class="dugme dugme--birincil" onclick="location.reload()">Yeniden dene</button><a class="dugme dugme--ikincil" href="panel.html#bugun">Bugün’e dön</a>'],
      bakim: ['Bakım', 'Bakım', 'BeautyOS kısa süreli bakımda.', 'Birkaç dakika sonra tekrar deneyin.', '<button class="dugme dugme--birincil" onclick="location.reload()">Sayfayı yenile</button>'],
      oturum: ['Oturum doldu', 'Oturum', 'Oturumunuzun süresi doldu.', 'Devam etmek için yeniden giriş yapın.', '<a class="dugme dugme--birincil" href="giris.html#giris">Giriş yap</a>'],
      pasif: ['Hesap aktif değil', 'Hesap', 'Hesabınız şu an aktif değil.', P.klinik ? 'Giriş yapmak için klinik sahibiyle iletişime geçin.' : 'Giriş yapmak için salon sahibiyle iletişime geçin.', '<a class="dugme dugme--ikincil" href="giris.html#giris">Giriş ekranına dön</a>'],
      cevrimdisi: ['Çevrim dışı', 'Bağlantı', 'Sunucuya ulaşılamadı.', 'İnternet bağlantınızı kontrol edip yeniden deneyin. Bağlantı yokken yeni kayıt açılamaz.', '<button class="dugme dugme--birincil" onclick="location.reload()">Yeniden dene</button>'],
    };
    function ciz() {
      const k = location.hash.slice(1) || '404';
      const [t, kod, h, a, b] = E[k] || E['404'];
      document.title = `${t} · BeautyOS`;
      document.getElementById('ust').innerHTML = P.marka('tanitim.html');
      document.getElementById('ana').innerHTML = `<p class="sy__kod">${kod}</p><h1>${h}</h1><p class="acik">${a}</p><div class="dugme-sirasi" style="margin-top:28px">${b}</div>`;
      document.getElementById('cevrimdisi').hidden = k !== 'cevrimdisi';
    }
    addEventListener('hashchange', ciz); ciz();
  </script>
</body>
</html>
