name: İmaj derleme kontrolü

# İmajlar SUNUCUDA derlenir (ADR-0018, deploy/betikler/derle.sh); bu iş akışı yalnız iki Dockerfile'ın hâlâ
# derlendiğini doğrular. Hiçbir yere GÖNDERMEZ (push: false), kayıt defterine giriş yapmaz, yetkisi yalnız okumadır.
# Eylemler tam commit SHA'sına sabitlenmiştir (yorumdaki sürüm etiketi bilgi içindir).
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/derleme.conf'
      - '.github/workflows/imaj.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derleme:
    name: Dockerfile derleme kontrolü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derleme değerlerini oku (deploy/derleme.conf, gizli değil)
        id: conf
        run: |
          api_url="$(sed -n 's/^NEXT_PUBLIC_API_URL_PROD=//p' deploy/derleme.conf)"
          if [ -z "$api_url" ]; then
            echo "HATA: deploy/derleme.conf içinde NEXT_PUBLIC_API_URL_PROD boş" >&2
            exit 1
          fi
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: API imajı derlenir (gönderilmez)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web imajı derlenir (gönderilmez)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.conf.outputs.api_url }}
            NODE_HEAP_MB=1536
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
