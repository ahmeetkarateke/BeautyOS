name: İmaj

# Üretim imajlarını derleyip özel GHCR'a gönderir. Dağıtım YAPMAZ: sunucuya SSH, yayın ya da migration adımı yoktur.
# Yayını devops elle yapar (önce staging, TEST GEÇTİ sonrası canlı).
# master/staging push'unda çalışmaz; yalnız elle (workflow_dispatch) ya da v* etiketiyle.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: imaj-${{ github.ref }}
  cancel-in-progress: false

env:
  KAYIT: ghcr.io

jobs:
  api:
    name: API imajı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Etiketleri hazırla
        id: ad
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "sahip=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.KAYIT }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.KAYIT }}/${{ steps.ad.outputs.sahip }}/beautyos-api:${{ steps.ad.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  web:
    name: Web imajı (${{ matrix.ortam }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ortam: prod
            api_url_degiskeni: NEXT_PUBLIC_API_URL_PROD
          - ortam: staging
            api_url_degiskeni: NEXT_PUBLIC_API_URL_STAGING
    steps:
      - uses: actions/checkout@v4
      - name: Etiketleri ve derleme değerlerini hazırla
        id: ad
        env:
          # Gizli değildir: repository variables (Settings > Variables). secrets.* kullanılmaz.
          API_URL_PROD: ${{ vars.NEXT_PUBLIC_API_URL_PROD }}
          API_URL_STAGING: ${{ vars.NEXT_PUBLIC_API_URL_STAGING }}
          ORTAM: ${{ matrix.ortam }}
        run: |
          if [ "$ORTAM" = "prod" ]; then api_url="$API_URL_PROD"; else api_url="$API_URL_STAGING"; fi
          if [ -z "$api_url" ]; then
            echo "HATA: NEXT_PUBLIC_API_URL_${ORTAM^^} repository variable tanımlı olmalı" >&2
            exit 1
          fi
          {
            echo "sha=${GITHUB_SHA::12}"
            echo "sahip=${GITHUB_REPOSITORY_OWNER,,}"
            echo "api_url=$api_url"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.KAYIT }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.ad.outputs.api_url }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_BOT_FEATURES_ENABLED=${{ vars.NEXT_PUBLIC_BOT_FEATURES_ENABLED || 'false' }}
          tags: ${{ env.KAYIT }}/${{ steps.ad.outputs.sahip }}/beautyos-web:${{ steps.ad.outputs.sha }}-${{ matrix.ortam }}
          cache-from: type=gha,scope=web-${{ matrix.ortam }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.ortam }}
