# BeautyOS üretim yığını (şirket sunucusu, 4 GB). Proje klasörü: /srv/beautyos
#
# Dosyalar (hepsini kurucu doldurur, git'e girmez; adlar için deploy/.env.example):
#   .env          api çalışma anı + compose değişkenleri (BEAUTYOS_VERSION, NEXT_PUBLIC_*)
#   .env.db       postgres süper kullanıcısı (yalnız postgres servisi okur)
#   .env.redis    redis parolası (yalnız redis servisi okur)
#   .env.migrate  MIGRATION_DATABASE_URL (yalnız migrate servisi okur; api'ye GİRMEZ)
#
# Derleme:   docker compose build
# Başlatma:  docker compose up -d
# Migration: docker compose --profile migrate run --rm migrate      [ONAY gerekir]
#
# Hiçbir servis host portu yayınlamaz. Dışarıya yalnız ortak Caddy (sirket-proxy ağı) açar.
# api TEK kopya çalışır: BullMQ işçisi süreç içindedir ve hız sınırı bellektedir; scale verme.

name: beautyos

x-guvenlik: &guvenlik
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *guvenlik
    image: postgres:17.2-bookworm
    user: postgres
    env_file: .env.db
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - timezone=UTC
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 768M }
    networks: [icsel]

  redis:
    <<: *guvenlik
    image: redis:7.4.1-alpine
    user: redis
    env_file: .env.redis
    # BullMQ için noeviction şart: bellek dolarsa iş silmek yerine yazmayı reddeder.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }
    networks: [icsel]

  migrate:
    <<: *guvenlik
    image: beautyos-api:${BEAUTYOS_VERSION:?deploy/.env içinde BEAUTYOS_VERSION tanımlı olmalı}
    profiles: [migrate]
    restart: "no"
    env_file: .env.migrate
    # Prisma şeması DATABASE_URL ve DIRECT_URL ister; ikisine de yalnız bu komutta migration rolü verilir.
    command:
      - sh
      - -c
      - DATABASE_URL="$$MIGRATION_DATABASE_URL" DIRECT_URL="$$MIGRATION_DATABASE_URL" exec /app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
    networks: [icsel]

  api:
    <<: *guvenlik
    image: beautyos-api:${BEAUTYOS_VERSION:?deploy/.env içinde BEAUTYOS_VERSION tanımlı olmalı}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "3001"
      # Gece cron'u ve no-show sınırı UTC varsayar. Heap, 512M sınırın altında tutulur.
      NODE_OPTIONS: --max-old-space-size=384
      # Prisma şeması DIRECT_URL'i çalışma anında da ister; uygulama rolüyle aynıdır.
      DIRECT_URL: ${DATABASE_URL:?deploy/.env içinde DATABASE_URL tanımlı olmalı}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks:
      icsel: {}
      proxy:
        aliases: [beautyos-api]

  web:
    <<: *guvenlik
    image: beautyos-web:${BEAUTYOS_VERSION:?deploy/.env içinde BEAUTYOS_VERSION tanımlı olmalı}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?deploy/.env içinde NEXT_PUBLIC_API_URL tanımlı olmalı}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_BOT_FEATURES_ENABLED: ${NEXT_PUBLIC_BOT_FEATURES_ENABLED:-false}
    environment:
      NODE_ENV: production
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=256
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384M }
    # Web yalnız Caddy'ye konuşur; veritabanına/redis'e erişimi yoktur.
    networks:
      proxy:
        aliases: [beautyos-web]

networks:
  # Dış dünyaya kapalı iç ağ: postgres/redis yalnız burada.
  icsel:
    internal: true
  # Ortak Caddy ile paylaşılan ağ (devops oluşturur). api dış servislere (Telegram, Gemini, NetGSM)
  # bu ağ üzerinden çıkar. Adı PROXY_NETWORK ile değiştirilebilir (test ortamı için).
  proxy:
    external: true
    name: ${PROXY_NETWORK:-sirket-proxy}

volumes:
  pgdata: {}
  redisdata: {}
