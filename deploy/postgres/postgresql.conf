# BeautyOS Postgres 17 ayarları (768M bellek sınırı, iki veritabanı: beautyos, beautyos_staging).
listen_addresses = '*'
unix_socket_directories = '/var/run/postgresql'
max_connections = 40
shared_buffers = 192MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'
# Yavaş sorgular günlüğe düşer (parametre değerleri yazılmaz).
log_min_duration_statement = 1000
log_connections = off
