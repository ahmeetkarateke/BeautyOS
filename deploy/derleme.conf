# Web imajına derleme anında gömülen değerler (GİZLİ DEĞİL; tarayıcıda herkes görür). derle.sh bu dosyayı
# derlenen commit'in içinden okur, bu yüzden değerler commit'e bağlıdır ve sürümlenir.
# Biçim: ANAHTAR=değer (tırnaksız, yorum satırı #). Gizli değer BURAYA YAZILMAZ; .env* dosyaları derlemede okunmaz.
NEXT_PUBLIC_API_URL_PROD=https://api.beautyossapp.com
NEXT_PUBLIC_API_URL_STAGING=https://yeni-api.beautyossapp.com
# Cloudflare Turnstile SITE anahtarı (herkese açık; gizli anahtar değildir). Boşsa randevu formunda CAPTCHA çıkmaz.
NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAADNFAIKI83ansPqF
NEXT_PUBLIC_BOT_FEATURES_ENABLED=false
# Yeni arayüz (v2) yüzey bayrağı (ADR-UI-02): web imajına NEXT_PUBLIC_UI_V2 olarak geçer. Virgülle ayrılmış küçük harfli
# yüzey adları; yalnız [a-z,] karakterleri. BOŞ ya da tanımsız = v2 KAPALI (kapalı başarısızlık). Canlı bilerek boş.
NEXT_PUBLIC_UI_V2_PROD=
NEXT_PUBLIC_UI_V2_STAGING=site,auth,panel,book,admin
# Tasarım sistemi vitrini (/v2/tasarim-sistemi): YALNIZ staging imajı. "1" = açık, boş/tanımsız = kapalı. Canlı için anahtar
# (NEXT_PUBLIC_UI_V2_SHOWCASE_PROD ya da NEXT_PUBLIC_UI_V2_SHOWCASE) tanımlanamaz: derle.sh derlemeyi durdurur.
NEXT_PUBLIC_UI_V2_SHOWCASE_STAGING=1
